<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCmeP1hFKsFGBHxTs3so6h4ngD1UsbQBr0",
    authDomain: "cctv-rayongboard.firebaseapp.com",
    projectId: "cctv-rayongboard",
    storageBucket: "cctv-rayongboard.firebasestorage.app",
    messagingSenderId: "129595589663",
    appId: "1:129595589663:web:9c3167b5bc4aeea631412a"
  };
  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // expose แบบง่ายให้โค้ด babel เรียกใช้
    window.__fb = {
      db, ready: true,
      // เขียนข้อมูล 1 key ขึ้น cloud
      save: async (key, data) => {
        const payload = JSON.stringify(data);
        const notify = (reason) => window.dispatchEvent(new CustomEvent("fb-sync", { detail:{ key, ok:!reason, reason, size:payload.length } }));
        // Firestore จำกัด 1 MB ต่อเอกสาร กันไว้ก่อนยิง จะได้บอกผู้ใช้ได้ตรง ๆ
        if (payload.length > 950000) { console.warn("fb save too big", key, payload.length); notify("too-big"); return; }
        try { await setDoc(doc(db, "cctv", key), { data: payload, ts: Date.now() }); notify(null); }
        catch(e){ console.warn("fb save fail", key, e); notify(e.code || e.message || "error"); }
      },
      // อ่านเอกสารเดี่ยวแบบครั้งเดียว ใช้ดึงรูปตามต้องการ
      get: async (key) => {
        try {
          const snap = await getDoc(doc(db, "cctv", key));
          if (snap.exists()) { const v = snap.data(); if (v && v.data) return JSON.parse(v.data); }
          return null;
        } catch(e){ console.warn("fb get fail", key, e); return null; }
      },
      // ฟังการเปลี่ยนแปลงของ 1 key
      listen: (key, cb) => {
        try {
          return onSnapshot(doc(db, "cctv", key), (snap)=>{
            // exists=false หรืออ่านไม่ได้ ต้องแจ้งกลับด้วย ไม่งั้นฝั่ง React จะไม่รู้ว่า cloud ว่าง
            if(snap.exists()){
              const v=snap.data();
              if(v&&v.data){ try{ cb(JSON.parse(v.data), v.ts, true); }catch(e){ cb(null, 0, false); } }
              else cb(null, 0, false);
            } else cb(null, 0, false);
          }, (err)=>console.warn("fb listen fail", key, err));
        } catch(e){ console.warn("fb listen setup fail", key, e); return null; }
      }
    };
    window.dispatchEvent(new Event("firebase-ready"));
    console.log("Firebase connected:", firebaseConfig.projectId);
  } catch(e) {
    console.warn("Firebase init failed, using localStorage only:", e);
    window.__fb = { ready:false, save:()=>{}, get:async()=>null, listen:()=>null };
  }
</script>

  }, [logs]);
  // สำรองอัตโนมัติวันละชุด เก็บ 7 ชุดล่าสุด (กันข้อมูลหายซ้ำรอยเดิม)
  useEffect(() => {

  // ─────────── รูปแนบ: เก็บแยกเอกสารละรูป ───────────
  // บันทึกจะเก็บแค่ตัวอ้างอิง "img:<id>" ส่วนรูปจริงอยู่ในเอกสาร cctv/img_<id>
  // ทำให้เอกสารหลักเล็ก ไม่ชนเพดาน 1 MB ของ Firestore
  const IMGREF = "img:";

  };
  const fixImgId = (id) => id + "_fix";                 // รหัสรูปหลังแก้ของบันทึกนั้น
  const imgFixOf = (l) => !l || !l.imgFix ? "" : (isImgData(l.imgFix) ? l.imgFix : (isImgRef(l.imgFix) ? (imgCache[imgIdOf(l.imgFix)] || "") : ""));
  const imgLoading = React.useRef({});
  const loadImage = async (id) => {
    if (!id || imgCache[id] || imgLoading.current[id]) return;
    imgLoading.current[id] = true;
    try {
      const local = localStorage.getItem(imgLocalKey(id));
      if (local) { setImgCache(c => ({...c, [id]: local})); return; }
    } catch(e){}
    if (window.__fb && window.__fb.ready) {
      const data = await window.__fb.get("img_" + id);
      if (data) {

      }
    }
  };
  // คืนรูปที่พร้อมแสดง รองรับทั้งแบบเก่า (ฝังในบันทึก) และแบบใหม่ (อ้างอิง)
  const imgOf = (l) => !l || !l.img ? "" : (isImgData(l.img) ? l.img : (isImgRef(l.img) ? (imgCache[imgIdOf(l.img)] || "") : ""));

  // ─────────── Firebase Cloud Sync ───────────
  // ว่าง = null / [] / {} — ใช้ตัดสินว่าห้ามเขียนทับ
  const isEmptyVal = (v) => v===null || v===undefined
    || (Array.isArray(v) && v.length===0)
    || (typeof v==="object" && !Array.isArray(v) && Object.keys(v).length===0);
  const fbReady = React.useRef(false);
  const fbSkip = React.useRef({}); // กันเขียนวน: key -> true เมื่อเพิ่งรับจาก cloud
  const cloudSeen = React.useRef({}); // key -> true เมื่อได้รับ snapshot แรกจาก cloud แล้ว
  const allowClear = React.useRef({}); // key -> true เฉพาะตอนผู้ใช้ตั้งใจลบ
  const latest = React.useRef({}); // ค่าล่าสุดของแต่ละ state ให้ listener เทียบได้
  latest.current = { logs, accounts, ips, tree, reporters, passwords }; // ต้องอยู่หลังประกาศ ref
  useEffect(() => {
    let unsubs = [];
    const setup = () => {
      if (!window.__fb || !window.__fb.ready) return;
      fbReady.current = true;
      // map: key -> setter
      const setters = {
        logs: setLogs, accounts: setAccounts, ips: setIps,
        tree: setTree, reporters: setReporters, passwords: setPasswords,
      };
      Object.keys(setters).forEach(k=>{
        const u = window.__fb.listen(k, (data, ts, exists)=>{
          cloudSeen.current[k] = true;              // รู้แล้วว่า cloud มีอะไรอยู่ ถึงจะยอมให้เขียนขึ้นได้
          const local = latest.current[k];
          if (!exists || isEmptyVal(data)) {
            // cloud ว่าง: ถ้าเครื่องนี้มีข้อมูล ให้ดันขึ้นแทน ห้ามรับค่าว่างมาทับของในเครื่อง
            if (!isEmptyVal(local)) { try{ window.__fb.save(k, local); }catch(e){} }
            return;
          }
          fbSkip.current[k] = true;
          setters[k](data);
        });
        if(u) unsubs.push(u);
      });
    };
    if (window.__fb && window.__fb.ready) setup();
    else window.addEventListener("firebase-ready", setup, { once:true });
    return () => { unsubs.forEach(u=>{ try{u();}catch(e){} }); };
  }, []);

  // push แต่ละ state ขึ้น cloud เมื่อเปลี่ยน (ยกเว้นครั้งที่เพิ่งรับจาก cloud)
  const pushCloud = (key, val) => {
    if (!fbReady.current) return;
    if (fbSkip.current[key]) { fbSkip.current[key]=false; return; }
    if (val===null || val===undefined) return;
    // การ์ด 1: ยังไม่เคยได้ยินเสียงจาก cloud = ยังไม่รู้ว่ามีอะไรอยู่ ห้ามเขียนทับ
    if (!cloudSeen.current[key]) return;
    // การ์ด 2: ห้ามเขียนค่าว่างทับ เว้นแต่ผู้ใช้สั่งลบเอง (ตั้งธงไว้ก่อน)
    if (isEmptyVal(val) && !allowClear.current[key]) return;
    allowClear.current[key] = false;
    window.__fb.save(key, val);
  };
  useEffect(()=>{ pushCloud("logs", logs); }, [logs]);

  const months = useMemo(() => { if(!logs) return []; return [...new Set(logs.map(l=>l.date.slice(0,7)))].sort().reverse(); }, [logs]); // เรียงเดือนใหม่ → เก่า
  const view = useMemo(() => {
    if(!logs) return [];
    let a = logs;
    if (histMode==="day") a = a.filter(l=>l.date===histDay);
    else if (histMode==="range") {
      if (histFrom) a = a.filter(l=>l.date >= histFrom);
      if (histTo)   a = a.filter(l=>l.date <= histTo);
    }
    else if (mFilter!=="all") a = a.filter(l=>l.date.startsWith(mFilter));
    if (zFilter!=="all") a = a.filter(l=>l.zone===zFilter);
    if (sFilter!=="all") a = a.filter(l=>l.status===sFilter);
    if (byFilter!=="all") a = a.filter(l=>l.by===byFilter);

    if (isVendor) a = a.filter(l=>needsFix(l.status)); // ผู้รับเหมาเห็นเฉพาะรายการที่ต้องซ่อม
    if (fFilter!=="all") a = a.filter(l=>{

  // ย้ายรูปเก่าที่ฝังอยู่ในบันทึกออกไปเก็บแยก ทีละ 2 รูป จนหมด
  const migrating = React.useRef(false);

  const zoneStats = useMemo(() => { const m={}; ZONES.forEach(z=>m[z]=0); dashView.filter(l=>l.status==="กล้องดับ"&&l.zone).forEach(l=>m[l.zone]=(m[l.zone]||0)+1); return m; }, [dashView]);

  // ย่อรูปให้เล็กลงก่อนเก็บ ถ้าเบราว์เซอร์เปิดไฟล์ไม่ได้ (เช่น HEIC จาก iPhone) จะแจ้งให้ผู้ใช้รู้
  const compressImg = (file, onDone) => {
    const rd = new FileReader();
    rd.onerror = () => { setToast("❌ อ่านไฟล์รูปไม่ได้ ลองเลือกใหม่"); setTimeout(()=>setToast(""),3000); };
    rd.onload = () => {
      const raw = rd.result;
      const im = new Image();
      im.onerror = () => { setToast("❌ เบราว์เซอร์เปิดไฟล์รูปนี้ไม่ได้ ลองถ่ายใหม่หรือเลือกไฟล์ JPG"); setTimeout(()=>setToast(""),3800); };
      im.onload = () => {
        const shrink = (maxW, q) => {
          const cv = document.createElement("canvas"); const sc = Math.min(1, maxW/im.width);
          cv.width = im.width*sc; cv.height = im.height*sc;
          cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
          return cv.toDataURL("image/jpeg", q);
        };
        let data;
        try {
          data = shrink(1000, 0.72);
          if (data.length > 700000) data = shrink(800, 0.6); // ใหญ่ไป ย่อซ้ำ กันพื้นที่เก็บเต็ม
        } catch(err) {
          data = raw; // แคนวาสใช้ไม่ได้ ใช้ไฟล์เดิมไปก่อน ดีกว่าไม่ได้รูปเลย
        }
        onDone(data);
        setToast("📷 แนบรูปแล้ว กดบันทึกเพื่อยืนยัน"); setTimeout(()=>setToast(""),2600);
      };
      im.src = raw;
    };
    rd.readAsDataURL(file);
  };
  const pickImg = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    compressImg(f, setImg);
    e.target.value = "";
  };
  const camZoneMap = useMemo(() => {
    const m = {};
    Object.entries(tree).forEach(([z,g])=>Object.values(g).forEach(l=>l.forEach(c=>{ if(!m[c]) m[c]=z; })));
    return m;
  }, [tree]);
  const bulkImport = () => {
    const names = bulkText.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);

    if (!by) { setToast("กรุณาเลือกผู้รายงานก่อน"); setTimeout(()=>setToast(""),2400); return; }

    for (const l of logs) {
      if (isImgRef(l.img)) {
        const id = imgIdOf(l.img);
        let data = imgCache[id];
        if (!data) { try { data = localStorage.getItem(imgLocalKey(id)); } catch(e){} }
        if (!data && window.__fb && window.__fb.ready) data = await window.__fb.get("img_" + id);
        full.push({...l, img: data || ""});
      } else full.push(l);
    }
    const payload = { app:"cctv-rayongboard", type:"backup", savedAt:new Date().toISOString(),
      logs: full, tree, ips, reporters, accounts };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "cctv_backup_" + todayISO() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
    setToast("💾 ดาวน์โหลดไฟล์สำรองแล้ว"); setTimeout(()=>setToast(""),2600);
  };
  const importBackup = (e) => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let o; try { o = JSON.parse(rd.result); } catch(err){ setToast("❌ ไฟล์ไม่ถูกต้อง"); setTimeout(()=>setToast(""),2600); return; }
      const rows = Array.isArray(o) ? o : (Array.isArray(o.logs) ? o.logs : null);
      if(!rows){ setToast("❌ ไม่พบข้อมูลประวัติในไฟล์"); setTimeout(()=>setToast(""),2800); return; }
      askConfirm(`กู้คืนประวัติ ${rows.length} รายการจากไฟล์สำรอง?\nระบบจะรวมกับรายการที่มีอยู่ ไม่ลบของเดิม`, ()=>{
        const seen = new Set((logs||[]).map(l=>l.id));
        const add = rows.filter(r=>r && r.id!=null && !seen.has(r.id));
        setLogs([...(logs||[]), ...add].sort((x,y)=>x.date<y.date?1:-1));
        if(o.tree && typeof o.tree==="object" && Object.keys(o.tree).length) setTree(o.tree);
        if(o.ips && typeof o.ips==="object" && Object.keys(o.ips).length) setIps({...ips, ...o.ips});
        if(Array.isArray(o.reporters) && o.reporters.length) setReporters([...new Set([...reporters, ...o.reporters])]);
        setToast(`✅ กู้คืนแล้ว เพิ่มใหม่ ${add.length} รายการ`); setTimeout(()=>setToast(""),3200);
      }, "ยืนยันกู้คืน");
    };
    rd.readAsText(f);
    e.target.value = "";
  };
  const clearAllLogs = () => {
    askConfirm("ล้างประวัติการบันทึกทั้งหมด? แดชบอร์ดและประวัติจะว่างเปล่า เริ่มบันทึกใหม่ตั้งแต่ต้น\nการกระทำนี้ย้อนกลับไม่ได้", ()=>{
      allowClear.current.logs = true; // ผู้ใช้สั่งลบเอง อนุญาตให้ค่าว่างซิงก์ขึ้น cloud
      setLogs([]); setToast("ล้างข้อมูลแล้ว เริ่มบันทึกใหม่ได้เลย"); setTimeout(()=>setToast(""),2600);
    });
  };
  const resetTree = () => { askConfirm("รีเซ็ตรายชื่อกล้องทั้งหมดกลับเป็นค่าเริ่มต้น? การแก้ไขที่ทำไว้จะหายไป", ()=>{ setTree(DEFAULT_TREE); setMSub(""); setToast("รีเซ็ตข้อมูลกล้องแล้ว"); setTimeout(()=>setToast(""),2200); }); };
  const totalCams = useMemo(()=> { const set=new Set(); Object.values(tree).forEach(g=>Object.values(g).forEach(l=>l.forEach(c=>set.add(c)))); return set.size; }, [tree]);

  const doLogin = () => {
    const u = loginUser.trim().toLowerCase();
    const rec = accounts[u];
    if (!rec || (passwords[u]||rec.pass) !== loginPass) { setLoginErr("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"); return; }
    const a = { user: u, role: rec.role, name: rec.name };
    setAuth(a); try { sessionStorage.setItem(AUTH_KEY, JSON.stringify(a)); } catch(e){}
    setLoginUser(""); setLoginPass(""); setLoginErr("");
    setNav(rec.role==="vendor" ? "history" : "record");
  };
  const doLogout = () => { setAuth(null); try { sessionStorage.removeItem(AUTH_KEY); } catch(e){} };

  const addRep = () => { const v=newRep.trim(); if(!v||reporters.includes(v))return; setReporters([...reporters,v]); setNewRep(""); setToast("เพิ่มพนักงานแล้ว"); setTimeout(()=>setToast(""),2000); };
  const delRep = (i) => { const name=reporters[i]; askConfirm(`ลบชื่อ "${name}" ออกจากรายชื่อพนักงาน?`, ()=>{ setReporters(reporters.filter((_,x)=>x!==i)); if(by===name)setBy(""); }); };
  const saveEdit = () => { const v=editVal.trim(); if(!v){setEditIdx(-1);return;} setReporters(reporters.map((r,i)=>i===editIdx?v:r)); setEditIdx(-1); setEditVal(""); };
  const canSubmit = by && (status==="ปกติ" || (needsFix(status) && cam) || (status==="เหตุการณ์อื่น" && detail.trim()));
  // ── หน้า Login ──

  if (!auth) return (

      <div style={t.loginCard}>

        <div style={t.loginTitle}>สมุดเวร CCTV</div>
        <div style={t.loginSub}>เข้าสู่ระบบเพื่อใช้งาน</div>

        <div style={t.label}>👤 ชื่อผู้ใช้</div>
        <input value={loginUser} onChange={e=>{setLoginUser(e.target.value);setLoginErr("");}} onKeyDown={e=>{if(e.key==="Enter")doLogin();}} placeholder="ชื่อผู้ใช้" style={t.input} autoFocus/>

        <div style={t.label}>🔒 รหัสผ่าน</div>
        <div style={{position:"relative"}}>
          <input type={showPass?"text":"password"} value={loginPass} onChange={e=>{setLoginPass(e.target.value);setLoginErr("");}} onKeyDown={e=>{if(e.key==="Enter")doLogin();}} placeholder="••••••••" style={{...t.input, paddingRight:44}}/>
          <button onClick={()=>setShowPass(!showPass)} style={t.eyeBtn}>{showPass?"🙈":"👁"}</button>
        </div>

        {loginErr && <div style={t.loginErr}>⚠️ {loginErr}</div>}

        <button onClick={doLogin} className="tap" style={{...t.submit, marginTop:20}}>เข้าสู่ระบบ</button>

      </div>
      <div style={t.loginFoot}>RAYONGBOARD · Rayong · ระบบบันทึกสถานะกล้อง</div>
    </div>
  );

  if (logs===null) return <div style={{...t.app, display:"flex", alignItems:"center", justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{fontSize:34, animation:"pulse 1.6s infinite"}}>📹</div><div style={{color:t.dim, marginTop:12, fontFamily:mono, fontSize:13}}>กำลังเปิดสมุดเวร…</div></div></div>;

    ? [["history","🔧","งานซ่อม"]]

        <div style={t.sideSub} className="rb-hideM">ระบบบันทึกสถานะกล้อง</div>

        <nav style={t.nav} className="rb-nav">

        <div style={t.userCard} className="rb-hideM">

                <div style={t.segRow}>

                    return <button key={s} onClick={()=>setStatus(s)} className="tap" style={{...t.seg, borderColor:on?STATUS[s].dot:t.border, background:on?hex(STATUS[s].dot,dark?.14:.1):"transparent", color:on?STATUS[s].dot:t.dim}}>

                <div style={{display:"flex", gap:12, marginTop:2}}>
                  <div style={{flex:1}}><div style={t.label}>📅 วันที่</div><input type="date" value={dateVal} onChange={e=>setDateVal(e.target.value)} style={t.input}/></div>
                </div>
                <div style={t.label}>⏰ กะการทำงาน</div>
                <div style={t.shiftGrid}>

                      <span style={t.shiftName}>{s.key}</span>
                      <span style={{...t.shiftClock, color:on?(dark?"#5FD16E":"#2E8B3D"):t.dim}}>{s.time}</span>
                    </button>;
                  })}
                </div>

                {status==="ปกติ" ? (
                  <div style={t.note}>✅ ไม่มีเหตุผิดปกติ — กรอกชื่อผู้รายงานแล้วบันทึกได้เลย</div>
                ) : (
                  <div style={{animation:"fade .25s"}}>
                    <div style={t.label}>พื้นที่</div>
                    <div style={t.chipRow}>{ZONES.map(z=><button key={z} onClick={()=>{setZone(z);setCam("");setCamQuery("");setSubGrp("");}} className="tap" style={zone===z?{...t.chipOn, borderColor:ZONE_COLOR[z], background:hex(ZONE_COLOR[z],dark?.16:.11), color:ZONE_COLOR[z]}:t.chip}>{ZONE_EMOJI[z]} {z}</button>)}</div>
                    <div style={t.label}>โซน <span style={t.dimLabel}>({subGroups.length})</span></div>
                    <div style={t.chipRow}>{subGroups.map(sg=><button key={sg} onClick={()=>{setSubGrp(sg===subGrp?"":sg);setCam("");setCamQuery("");}} className="tap" style={subGrp===sg?t.chipOn:t.chip}>{sg} <span style={t.miniCount}>{(tree[zone][sg]||[]).length}</span></button>)}</div>
                    <div style={t.label}>🔍 เลือกกล้อง{status==="เหตุการณ์อื่น"?" (ถ้าเกี่ยวข้อง)":""} <span style={t.dimLabel}>({(CAMERAS[zone]||[]).length} ตัว · เลื่อนดูหรือพิมพ์ค้นหา)</span></div>
                    <input value={camQuery} onChange={e=>{setCamQuery(e.target.value); if(e.target.value)setSubGrp("");}} placeholder="พิมพ์ชื่อกล้อง เช่น SR1, Wall, FirePump…" style={t.input}/>
                    {(subGrp||camQuery) ? (

                    {cam && <div style={t.picked}>✓ เลือกกล้อง: <b>{cam}</b></div>}
                    <div style={{display:"flex", gap:12}}>

                      <div style={{flex:1}}><div style={t.label}>📝 {status==="เหตุการณ์อื่น"?"อธิบายเหตุการณ์":"รายละเอียด"}{status==="เหตุการณ์อื่น" && <span style={{color:"#EF4444"}}> *</span>}</div><input value={detail} onChange={e=>setDetail(e.target.value)} placeholder={status==="เหตุการณ์อื่น"?"เช่น อุบัติเหตุ จยย.ล้ม / สายไฟช็อต 20:25 น.":"เช่น ภาพไม่ขึ้นตั้งแต่ 19:20"} style={t.input}/></div>
                    </div>
                    <div style={t.label}>📷 แนบรูป</div>

                  {reporters.length===0 && <div style={t.empty}>ยังไม่มีพนักงาน — เพิ่มที่หน้า "จัดการพนักงาน"</div>}

                <button onClick={submit} disabled={!canSubmit} className="tap" style={{...t.submit, opacity:canSubmit?1:.4}}>💾 บันทึกรายงาน</button>
              </div>

                <div style={t.panelTitle}>🕒 บันทึกล่าสุด</div>

                {isAdmin && <button onClick={()=>{setShowBulk(true); setBulkDate(dateVal);}} className="tap" style={t.bulkBtn}>📥 นำเข้ากล้องดับหลายตัว</button>}
                <div style={{display:"flex", flexDirection:"column", gap:10, overflowY:"auto", maxHeight:640}}>
                  {logs.length===0 && <div style={t.miniEmpty}><div style={{fontSize:30, marginBottom:8}}>📋</div>ยังไม่มีบันทึก<br/><span style={{fontSize:12}}>เริ่มบันทึกเหตุการณ์แรกได้เลย</span></div>}
                  {logs.slice(0,8).map(l=>(
                    <div key={l.id} style={t.miniLog}>
                      <div style={{...t.miniBar, background:STATUS[l.status].dot}}/>
                      <div style={{flex:1, minWidth:0}}>
                        <div style={{display:"flex", justifyContent:"space-between", gap:8}}>
                          <span style={t.miniCam}>{l.cam||"เหตุการณ์ปกติ"}</span>
                          <span style={t.miniDate}>{fmtTH(l.date)}</span>
                        </div>
                        <div style={t.miniMeta}>{STATUS[l.status].emoji} {l.status}{l.zone?` · ${l.zone}`:""}{l.area?` · ${l.area}`:""}</div>
                      </div>

                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {nav==="history" && (
          <div style={t.wrap} className="rb-wrap">
            <div style={t.pageHead}>
              <div><div style={t.h1}>{isVendor ? "งานซ่อมกล้อง" : "ประวัติการบันทึก"}</div><div style={t.h1sub}>{view.length} รายการ{histMode==="day" ? ` · วันที่ ${fmtTH(histDay)}` : (histMode==="range" ? ((histFrom||histTo) ? ` · ${histFrom?fmtTH(histFrom):"เริ่มต้น"} ถึง ${histTo?fmtTH(histTo):"ล่าสุด"}` : " · ยังไม่ได้เลือกช่วง") : (mFilter!=="all" ? ` · เดือน${TH_M[+mFilter.slice(5)-1]}` : " · ทุกเดือน"))}{byFilter!=="all" ? ` · ${byFilter}` : ""}{camQ ? ` · กล้อง ${camQ}` : ""}</div></div>
              <button onClick={exportX} className="tap" style={{...t.exportBtn, marginRight:52}}>⬇️ ส่งออก Excel{mFilter!=="all" && ` (${TH_M[+mFilter.slice(5)-1]})`}</button>
            </div>

            <div style={t.filterBar}>
              <div style={t.dashToggle}>
                <button onClick={()=>setHistMode("month")} className="tap" style={histMode==="month"?t.dashTgOn:t.dashTg}>เลือกเดือน</button>
                <button onClick={()=>setHistMode("day")} className="tap" style={histMode==="day"?t.dashTgOn:t.dashTg}>เลือกวัน</button>
                <button onClick={()=>setHistMode("range")} className="tap" style={histMode==="range"?t.dashTgOn:t.dashTg}>ช่วงวันที่</button>
              </div>
              {histMode==="day" && <input type="date" value={histDay} onChange={e=>setHistDay(e.target.value)} style={t.select}/>}

              <button onClick={bulkImport} className="tap" style={{...t.submit, marginTop:0}}>📥 บันทึกกล้องดับทั้งหมด</button>
              <button onClick={()=>setShowBulk(false)} className="tap" style={{...t.dashExport, flex:"none"}}>ปิด</button>
            </div>
          </div>
        </div></Modal>
      )}
      {showSummary && (<Modal>
        <div style={t.modalBg} onClick={()=>setShowSummary(false)}>
          <div style={t.modalCard} onClick={e=>e.stopPropagation()}>
            <div style={t.panelTitle}>📋 สรุปประจำวัน (แก้ไขได้)</div>
            {summaryCopied
              ? <div style={t.copiedBanner}>✅ คัดลอกแล้ว — เปิดไลน์แล้ววาง (วาง/Paste) ได้เลย · แก้ข้อความแล้วกดคัดลอกอีกครั้งได้</div>
              : <div style={t.pwHint}>✏️ แก้ไขข้อความได้ตามต้องการ แล้วกดปุ่ม "คัดลอก" ด้านล่าง</div>
            }
            <textarea id="sumArea" value={summaryText} onChange={e=>setSummaryText(e.target.value)} style={t.summaryArea} placeholder="ข้อความสรุป..."/>
            <div style={{display:"flex", gap:10, marginTop:14}}>
              <button onClick={async()=>{ let ok=false; if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(summaryText);ok=true;}catch(e){}} if(!ok){const ta=document.querySelector("#sumArea"); if(ta){ta.focus();ta.select();} try{ok=document.execCommand("copy");}catch(e){}} setSummaryCopied(ok); setToast(ok?"📋 คัดลอกแล้ว — วางในไลน์ได้เลย":"เลือกข้อความแล้วคัดลอกเอง"); setTimeout(()=>setToast(""),2400);}} className="tap" style={{...t.submit, marginTop:0}}>📋 คัดลอก</button>
              <button onClick={()=>setShowSummary(false)} className="tap" style={{...t.dashExport, flex:"none"}}>ปิด</button>
            </div>
          </div>
        </div></Modal>
      )}
      <button onClick={()=>setDark(!dark)} className="tap" style={t.themeToggle} title={dark?"โหมดสว่าง":"โหมดมืด"}>{dark?"☀️":"🌙"}</button>
      {toast && <div style={t.toast}>{toast}</div>}
    </div>
  );
}
