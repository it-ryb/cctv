<style>
  html{overflow-x:hidden;}
  html,body{margin:0;padding:0;background:#F9F3E1;font-family:'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button{cursor:pointer;font-family:inherit;}select{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5);cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  input:focus,select:focus{border-color:#0B6FC4 !important;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}
  /* Edge/IE ใส่ไอคอนตากับกากบาทในช่องรหัสผ่านเอง ต้องซ่อน ไม่งั้นซ้อนกับปุ่มของเรา */

  .tap:hover{filter:brightness(1.08);}
  .tap:active{transform:scale(.97);}
  #root{opacity:0;animation:fade .4s ease forwards;}
  /* Responsive: มือถือ/แท็บเล็ต */
  .rb-lbShort{display:none;}
  @media (max-width: 900px){
    /* iPhone ซูมหน้าเองเวลาแตะช่องที่ตัวหนังสือเล็กกว่า 16px แล้วค้างอยู่ จึงให้ช่องกรอกบนมือถือเป็น 16px */
    input,select,textarea{font-size:16px !important;}
    .rb-roleGrid{grid-template-columns:1fr !important;}
    .rb-stepGrid4{grid-template-columns:1fr 1fr !important;}
    .rb-maGrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
    .rb-dutyGrid{grid-template-columns:minmax(0,1fr) !important;}
    .rb-dutyCols{grid-template-columns:minmax(0,1fr) !important;}
    .rb-dutyTitle{font-size:21px !important;}
    .rb-dutyOpen{margin-right:0 !important;}
    .rb-dutyMascot{display:none !important;}
    .rb-lbFull{display:none;} .rb-lbShort{display:inline;}
    .rb-app{flex-direction:column !important;}
    .rb-side{width:100% !important; height:auto !important; position:static !important; flex-direction:row !important; flex-wrap:wrap !important; align-items:center !important; gap:10px !important; padding:14px 16px !important;}
    .rb-side .rb-hideM{display:none !important;}
    .rb-loginBox{grid-template-columns:minmax(0,1fr) !important; max-width:420px !important;}
    .rb-loginSide{display:none !important;}
    .rb-showM{display:flex !important;}

    .rb-app{overflow-x:clip !important;}
    html{overflow-x:hidden;}
    .rb-recGrid{grid-template-columns:minmax(0,1fr) !important;}
    .rb-recGrid > *{min-width:0; max-width:100%;}
    html, body{overflow-x:clip;} /* กันหน้าเลื่อนซ้ายขวาบนมือถือ */
    .rb-dashGrid{grid-template-columns:minmax(0,1fr) !important;}
    .rb-camManGrid{grid-template-columns:minmax(0,1fr) !important;}
    .rb-wrap [style*="grid-template-columns: 1fr 1fr"]{grid-template-columns:minmax(0,1fr) !important;}
    .rb-statGrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
    .rb-heroGrid{grid-template-columns:repeat(3, minmax(0,1fr)) !important; gap:10px !important;}
    .rb-heroGrid > :first-child{grid-column:1 / -1;}
    .rb-heroGrid > button:not(:first-child){padding:12px 10px !important; border-radius:14px !important; min-width:0; gap:4px;}
    .rb-heroGrid > button:not(:first-child) > div:first-child{flex-direction:column !important; align-items:flex-start !important; gap:3px !important;}
    .rb-heroGrid > button:not(:first-child) > div:first-child > span:last-child{font-size:11.5px !important; white-space:nowrap; letter-spacing:-.2px;}
    .rb-heroGrid > button:not(:first-child) > div:nth-child(2){font-size:30px !important; margin:4px 0 !important; line-height:1.1 !important;}
    .rb-heroGrid > button:not(:first-child) > div:nth-child(3){font-size:11px !important; line-height:1.35 !important;}
    .rb-miniGrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
    .rb-wrap{padding:18px 16px 50px !important;}
    .rb-tableWrap{overflow-x:auto !important;}

    /* แถบบน: กระจกใส ติดด้านบนตอนเลื่อน มีน้องกล้อง + ชื่อระบบ */

      padding:calc(8px + env(safe-area-inset-top)) 14px 8px !important; border-right:none !important;
      background:transparent !important; isolation:isolate;
      border-bottom:1px solid rgba(255,255,255,.8) !important; box-shadow:0 4px 18px rgba(28,80,140,.08) !important;}
    /* เบลอไว้ที่ชั้นพื้นหลังแยก: ถ้าใส่ blur ที่ตัวแถบบนตรง ๆ แถบล่าง (ซึ่งอยู่ข้างใน) จะถูกดึงขึ้นไปติดด้านบนแทน */
    .rb-side::before{content:""; position:absolute; inset:0; z-index:-1; background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(16px) saturate(1.5); backdrop-filter:blur(16px) saturate(1.5);}
    .rb-app[data-dark="1"] .rb-side::before{background:rgba(15,21,28,.7);}
    .rb-app[data-dark="1"] .rb-side{border-bottom-color:rgba(255,255,255,.08) !important;}
    .rb-side .rb-brand{margin:0 !important; gap:9px !important; padding:0 !important; min-width:0;}
    .rb-side .rb-brand > span:first-child{width:42px !important; height:42px !important;}
    .rb-side .rb-brand > span:first-child svg{width:38px !important; height:38px !important;}
    .rb-side .rb-brand > span:first-child i{font-size:11px !important; right:-4px !important; top:-4px !important;}
    .rb-side .rb-brand > div > div:first-child{font-size:18px !important;}
    .rb-side .rb-brand > div > div:nth-child(2){font-size:9.5px !important; letter-spacing:1.4px !important; margin-top:2px !important;}
    .rb-side .rb-brand > div > div:nth-child(3){display:none !important;}
    .rb-side > div[style*="flex: 1"]{flex:1 !important;}
    .rb-logout{margin:0 0 0 auto !important; padding:9px 12px !important; border-radius:999px !important; font-size:16px !important; line-height:1 !important;
      background:rgba(255,255,255,.7) !important; border:1px solid rgba(239,68,68,.25) !important;}
    .rb-logoutTx{display:none;}
    /* มือถือ: ปุ่มโหมดมืดย้ายเข้าไปอยู่ในแถบบนข้างปุ่มออก ไม่ลอยแยก */
    .rb-theme{display:none !important;}
    .rb-themeIn{display:flex !important; flex-shrink:0; width:40px; height:40px; border-radius:999px !important; align-items:center; justify-content:center; font-size:18px;}

    /* แถบล่าง: การ์ดใสลอยแบบ LINE โค้งมน เห็นพื้นหลังจาง ๆ */
    .rb-nav{position:fixed !important; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:60; flex:none !important; flex-direction:row !important;
      justify-content:space-around !important; gap:2px !important; margin:0 !important; overflow:visible !important; padding:6px !important; border-radius:30px;
      background:rgba(255,255,255,.58); -webkit-backdrop-filter:blur(20px) saturate(1.7); backdrop-filter:blur(20px) saturate(1.7);
      border:1px solid rgba(255,255,255,.75); box-shadow:0 12px 32px rgba(28,80,140,.18), inset 0 1px 0 rgba(255,255,255,.9);}
    .rb-app[data-dark="1"] .rb-nav{background:rgba(22,30,42,.62); border-color:rgba(255,255,255,.1); box-shadow:0 12px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);}
    .rb-nav > button{flex:1 1 0 !important; min-width:0 !important; flex-direction:column !important; align-items:center !important; justify-content:center !important; gap:2px !important;
      padding:7px 2px 6px !important; margin:0 !important; border:none !important; border-radius:24px !important; background:transparent !important; box-shadow:none !important;
      position:relative !important; font-size:11px !important; font-weight:600 !important;}
    /* ฟองไฮไลต์เลื่อนได้แบบ iOS: ปุ่มที่เลือกโปร่ง ให้ฟองด้านหลังเลื่อนตามแทน */
    .rb-nav{touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
    .rb-nav > button.rb-navOn{background:transparent !important; box-shadow:none !important;}
    .rb-nav > button{z-index:1; transition:transform .25s cubic-bezier(.34,1.5,.5,1) !important;}
    .rb-nav.rb-navDrag > button.rb-navHover{transform:scale(1.08);}
    .rb-navPill{display:block !important; position:absolute; top:6px; bottom:6px; left:0; width:0; border-radius:24px; z-index:0; pointer-events:none;
      background:rgba(255,255,255,.88); box-shadow:0 3px 12px rgba(28,80,140,.14), inset 0 1px 0 rgba(255,255,255,.95); will-change:transform,width;}
    .rb-nav.rb-navDrag .rb-navPill{background:rgba(255,255,255,.62); box-shadow:0 8px 24px rgba(28,80,140,.22), inset 0 0 0 1px rgba(255,255,255,.9);}
    .rb-app[data-dark="1"] .rb-navPill{background:rgba(255,255,255,.13); box-shadow:0 3px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.12);}
    .rb-app[data-dark="1"] .rb-nav.rb-navDrag .rb-navPill{background:rgba(255,255,255,.2);}
    .rb-nav .rb-navIc{font-size:22px !important; height:30px; display:flex; align-items:center; justify-content:center;}
    .rb-nav .rb-navLb{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .rb-nav .rb-navBadge{position:absolute !important; top:1px !important; right:auto !important; left:calc(50% + 7px) !important; margin:0 !important; min-width:18px !important; height:18px !important;
      font-size:10px !important; padding:0 5px !important; border:2px solid #fff;}
    .rb-wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom)) !important;}
    .rb-toast{bottom:calc(100px + env(safe-area-inset-bottom)) !important; max-width:calc(100vw - 32px); white-space:normal !important; text-align:center;}

    /* iPhone บังคับช่องวันที่/เวลาให้กว้างเกินที่มี จนซ้อนกัน: ให้ยืดหดตามกล่อง และวางคนละแถว */
    .rb-dtRow > div{flex:1 1 100% !important;}
    input[type="date"], input[type="time"]{min-width:0 !important; width:100%; -webkit-appearance:none; appearance:none; display:block;}
    input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value{text-align:left;}

    /* ปุ่มสถานะ: 3 ช่องต่อแถว กะทัดรัด (เดิมโดนกฎ 1 คอลัมน์ ทำให้เรียงยาวลงมา 6 ปุ่ม) */

    .rb-wrap .rb-stGrid > button{padding:12px 4px !important; gap:4px !important; font-size:12.5px !important; border-radius:13px !important; min-height:0 !important;}
    .rb-wrap .rb-stGrid > button > span:first-child{font-size:22px !important;}
    .rb-wrap .rb-stGrid > button.rb-stWide{padding:10px 4px !important; gap:8px !important;}
    .rb-wrap .rb-shGrid{grid-template-columns:repeat(3, minmax(0,1fr)) !important; gap:8px !important;}
    .rb-wrap .rb-shGrid > button{padding:10px 4px !important;}
    .rb-wrap .rb-shGrid:has(> button:nth-child(4)){grid-template-columns:repeat(2, minmax(0,1fr)) !important;}  /* 4 กะ (บัญชี IT) = 2×2 ไม่ให้ตัวสุดท้ายโดดเดี่ยว */
  }
</style>

<body>
<div id="root"></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence,
           browserSessionPersistence, inMemoryPersistence, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCmeP1hFKsFGBHxTs3so6h4ngD1UsbQBr0",
    authDomain: "cctv-rayongboard.firebaseapp.com",
    projectId: "cctv-rayongboard",
    storageBucket: "cctv-rayongboard.firebasestorage.app",
    messagingSenderId: "129595589663",
    appId: "1:129595589663:web:9c3167b5bc4aeea631412a"
  };
  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    // ล็อกอินอยู่แค่ในแท็บนี้ ปิดแอป/แท็บแล้วต้องล็อกอินใหม่ (เหมือนเดิม)
    setPersistence(auth, browserSessionPersistence).catch(()=>{});
    // ชื่อผู้ใช้ → อีเมลภายใน (ไม่มีการส่งอีเมลจริง ใช้แค่เป็นรหัสบัญชีของ Firebase)
    const toEmail = (u) => String(u||"").trim().toLowerCase() + "@cctv.rayongboard.com";
    // แอปตัวที่สองไว้สร้างบัญชีให้คนอื่น โดยไม่ทำให้ผู้ดูแลหลุดจากระบบ
    let maker = null;
    const getMaker = () => {
      if (!maker) { const a2 = initializeApp(firebaseConfig, "account-maker"); maker = getAuth(a2); setPersistence(maker, inMemoryPersistence).catch(()=>{}); }
      return maker;
    };
    const errCode = (e) => (e && (e.code || e.message)) || "error";
    // expose แบบง่ายให้โค้ด babel เรียกใช้
    window.__fb = {
      db, ready: true, authReady: true,
      // ── ล็อกอิน (Firebase เก็บและตรวจรหัสผ่านเอง รหัสผ่านไม่อยู่ในฐานข้อมูลของเรา) ──
      signIn: async (u, pass) => {
        try { const c = await signInWithEmailAndPassword(auth, toEmail(u), pass); return { ok:true, uid:c.user.uid }; }
        catch(e){ return { ok:false, code:errCode(e) }; }
      },
      // ใช้ตอนย้ายบัญชีเดิมเข้าระบบใหม่ครั้งแรก (สร้างแล้วล็อกอินเลย)
      signUpSelf: async (u, pass) => {
        try { const c = await createUserWithEmailAndPassword(auth, toEmail(u), pass); return { ok:true, uid:c.user.uid }; }
        catch(e){ return { ok:false, code:errCode(e) }; }
      },
      // ผู้ดูแลสร้างบัญชีให้คนอื่น
      createUser: async (u, pass) => {
        const m = getMaker();
        try { const c = await createUserWithEmailAndPassword(m, toEmail(u), pass); const uid = c.user.uid; await signOut(m); return { ok:true, uid }; }
        catch(e){ try{ await signOut(m); }catch(_){} return { ok:false, code:errCode(e) }; }
      },
      signOut: async () => { try { await signOut(auth); } catch(e){} },
      onAuth: (cb) => onAuthStateChanged(auth, (user) => cb(user ? { uid:user.uid, email:user.email } : null)),
      currentUid: () => auth.currentUser ? auth.currentUser.uid : null,
      // เปลี่ยนรหัสผ่านของตัวเอง ต้องยืนยันรหัสเดิมก่อน
      changeOwnPassword: async (oldPass, newPass) => {
        const user = auth.currentUser; if (!user) return { ok:false, code:"no-user" };
        try { await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, oldPass)); await updatePassword(user, newPass); return { ok:true }; }
        catch(e){ return { ok:false, code:errCode(e) }; }
      },
      // ── สิทธิ์ของแต่ละบัญชี เก็บแยกใน cctv_roles/{uid} กฎของ Firestore อ่านจากตรงนี้ ──
      getRole: async (uid) => { try { const s = await getDoc(doc(db, "cctv_roles", uid)); return s.exists() ? s.data() : null; } catch(e){ return { error:errCode(e) }; } },
      setRole: async (uid, data) => { try { await setDoc(doc(db, "cctv_roles", uid), data); return { ok:true }; } catch(e){ return { ok:false, code:errCode(e) }; } },
      delRole: async (uid) => { try { await deleteDoc(doc(db, "cctv_roles", uid)); return { ok:true }; } catch(e){ return { ok:false, code:errCode(e) }; } },
      // ลบเอกสาร (ใช้ลบรหัสผ่านแบบเก่าที่ค้างในฐานข้อมูล)
      remove: async (key) => { try { await deleteDoc(doc(db, "cctv", key)); return { ok:true }; } catch(e){ return { ok:false, code:errCode(e) }; } },
      // เขียนข้อมูล 1 key ขึ้น cloud
      save: async (key, data) => {
        const payload = JSON.stringify(data);
        const notify = (reason) => window.dispatchEvent(new CustomEvent("fb-sync", { detail:{ key, ok:!reason, reason, size:payload.length } }));
        // Firestore จำกัด 1 MB ต่อเอกสาร กันไว้ก่อนยิง จะได้บอกผู้ใช้ได้ตรง ๆ
        if (payload.length > 950000) { console.warn("fb save too big", key, payload.length); notify("too-big"); return; }
        try { await setDoc(doc(db, "cctv", key), { data: payload, ts: Date.now() }); notify(null); }
        catch(e){ console.warn("fb save fail", key, e); notify(e.code || e.message || "error"); }
      },
      // อ่านเอกสารเดี่ยวแบบครั้งเดียว ใช้ดึงรูปตามต้องการ
      get: async (key) => {
        try {
          const snap = await getDoc(doc(db, "cctv", key));
          if (snap.exists()) { const v = snap.data(); if (v && v.data) return JSON.parse(v.data); }
          return null;
        } catch(e){ console.warn("fb get fail", key, e); return null; }
      },
      // ฟังการเปลี่ยนแปลงของ 1 key
      listen: (key, cb) => {
        try {
          return onSnapshot(doc(db, "cctv", key), (snap)=>{
            // exists=false หรืออ่านไม่ได้ ต้องแจ้งกลับด้วย ไม่งั้นฝั่ง React จะไม่รู้ว่า cloud ว่าง
            if(snap.exists()){
              const v=snap.data();
              if(v&&v.data){ try{ cb(JSON.parse(v.data), v.ts, true); }catch(e){ cb(null, 0, false); } }
              else cb(null, 0, false);
            } else cb(null, 0, false);
          }, (err)=>console.warn("fb listen fail", key, err));
        } catch(e){ console.warn("fb listen setup fail", key, e); return null; }
      }
    };
    window.dispatchEvent(new Event("firebase-ready"));
    console.log("Firebase connected:", firebaseConfig.projectId);
  } catch(e) {
    console.warn("Firebase init failed, using localStorage only:", e);
    window.__fb = { ready:false, authReady:false, save:()=>{}, get:async()=>null, listen:()=>null };
  }
</script>

const lsKeys = (prefix) => {

  const over = imgKeys().length - IMG_KEEP;
  if (over > 0) dropOldImages(over);
};
const clearImageCache = () => {
  const keys = imgKeys();
  keys.forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
  try { localStorage.removeItem(LRU_KEY); } catch(e){}
  return keys.length;
};
// เขียนลง localStorage แบบทนพื้นที่เต็ม: เต็มแล้วทิ้งสำเนารูปเก่าก่อน ค่อยลองเขียนใหม่
const lsSet = (key, val) => {
  for (let round=0; round<6; round++) {
    try { localStorage.setItem(key, val); return true; } catch(e) {}
    if (round === 5) return false;
    if (!dropOldImages(Math.pow(2, round + 1))) {    // ทิ้งทีละน้อยก่อน 2→4→8→16→32 ใบ
      const bk = lsKeys(BK_PREFIX).filter(k => k !== BK_PREFIX + todayISO()).sort();
      if (!bk.length) return false;
      try { localStorage.removeItem(bk[0]); } catch(err){ return false; }
    }
  }
  return false;
};

// เลือกแผนกจากรายการ (ไม่ใช่ช่องพิมพ์ที่กรองตามคำที่ค้างอยู่ ซึ่งทำให้เห็นแค่ตัวเลือกเดียว)
// เมนูเลือกสิทธิ์แบบทำเอง (เมนูของเบราว์เซอร์ใส่ไอคอน/คำอธิบายไม่ได้ และหน้าตาไม่เข้ากับเว็บ)
function RolePicker({ t, value, disabled, onChange, pillStyle, title }) {
  const [open, setOpen] = useState(false);
  const [menuPos, setMenuPos] = useState(null);
  const ref = React.useRef(null);
  // วางเมนูให้อยู่ในจอเสมอ: ชิดขวาของป้ายก่อน ถ้าล้นก็เลื่อนเข้ามา
  const toggle = () => {
    if (!open && ref.current) {
      const r = ref.current.getBoundingClientRect(), vw = window.innerWidth || 1024;
      const w = Math.min(270, vw - 24);
      const abs = Math.max(12, Math.min(r.right - w, vw - 12 - w));
      setMenuPos({ left: abs - r.left, width: w });
    }
    setOpen(o => !o);
  };
  useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", close); document.addEventListener("touchstart", close); document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("touchstart", close); document.removeEventListener("keydown", esc); };
  }, [open]);
  const cur = ROLES.find(r => r.key === value) || ROLES[0];
  return (
    <span ref={ref} style={{position:"relative", flexShrink:0}}>
      <button type="button" data-role-pill="1" disabled={disabled} onClick={toggle} className="tap" style={{...pillStyle, fontFamily:"inherit"}} title={title} aria-haspopup="listbox" aria-expanded={open}>
        <Emo e={cur.icon}/><span>{cur.name}</span>{!disabled && <span style={{opacity:.55, fontSize:10, transform:open?"rotate(180deg)":"none", transition:"transform .15s"}}>▾</span>}
      </button>
      {open && <div role="listbox" style={menuPos ? {...t.roleMenu, right:"auto", left:menuPos.left, width:menuPos.width} : t.roleMenu}>
        <div style={t.roleMenuHead}>เลือกสิทธิ์</div>
        {ROLES.map(r => { const on = r.key === value; return (
          <button key={r.key} type="button" role="option" aria-selected={on} data-role={r.key} className="tap"
                  onClick={() => { setOpen(false); if (!on) onChange(r.key); }} style={on ? t.roleOptOn : t.roleOpt}>
            <span style={t.roleOptIc}><Emo e={r.icon}/></span>
            <span style={{flex:1, minWidth:0}}><span style={t.roleOptName}>{r.name}</span><span style={t.roleOptDesc}>{r.desc}</span></span>
            {on && <span style={t.roleOptCheck}>✓</span>}
          </button>); })}
      </div>}
    </span>
  );

// เมนูเลือกแบบทำเอง ใช้แทนเมนูของเบราว์เซอร์ทั้งเว็บ (ของเบราว์เซอร์เป็นกล่องเทา ๆ ไม่เข้ากับเว็บ)
// options: [[value, label, icon?], ...] · มี <select> ซ่อนไว้ข้างใน เพื่อให้ชุดทดสอบ/โปรแกรมอ่านจอใช้ได้เหมือนเดิม
function usePopover() {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const ref = React.useRef(null);
  useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", close); document.addEventListener("touchstart", close); document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("touchstart", close); document.removeEventListener("keydown", esc); };
  }, [open]);
  // วางเมนูให้อยู่ในจอเสมอ: ชิดซ้ายของช่องก่อน ถ้าล้นขวาก็เลื่อนเข้ามา · ถ้าข้างล่างไม่พอให้เปิดขึ้นบน
  const place = (minW) => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect(), vw = window.innerWidth || 1024, vh = window.innerHeight || 800;
    const w = Math.min(Math.max(r.width, minW || 0), vw - 24);
    const abs = Math.max(12, Math.min(r.left, vw - 12 - w));
    const below = vh - r.bottom, up = below < 260 && r.top > below;
    setPos({ left: abs - r.left, width: w, up, maxH: Math.max(160, Math.min(340, (up ? r.top : below) - 24)) });
  };
  return { open, setOpen, pos, place, ref };
}
const Chevron = ({ open }) => <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" style={{flex:"none", opacity:.6, transform:open?"rotate(180deg)":"none", transition:"transform .15s"}}><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>;
function Pick({ t, value, onChange, options, style, placeholder, title, minWidth, mono: isMono }) {

  const opts = options.map(o => Array.isArray(o) ? { v:o[0], l:o[1], ic:o[2] } : o);
  const cur = opts.find(o => String(o.v) === String(value));
  const searchable = opts.length > 20;
  const shown = searchable && q ? opts.filter(o => String(o.l).toLowerCase().includes(q.toLowerCase())) : opts;
  const pick = (v) => { pp.setOpen(false); setQ(""); if (String(v) !== String(value)) onChange(v); };
  return (
    <span ref={pp.ref} style={{position:"relative", display:"inline-block", width:(style&&style.width)||undefined, flex:(style&&style.flex)||undefined, minWidth:0, maxWidth:"100%"}} className="rb-pick">
      <button type="button" title={title} aria-haspopup="listbox" aria-expanded={pp.open} className="tap"
              onClick={() => { if (!pp.open) pp.place(minWidth || 200); pp.setOpen(!pp.open); }}
              style={{...style, width:"100%", display:"flex", alignItems:"center", gap:8, textAlign:"left", cursor:"pointer", fontFamily:isMono&&cur?t.monoFont:"inherit"}}>
        {cur && cur.ic && <Emo e={cur.ic}/>}
        <span style={{flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", opacity:cur?1:.55}}>{cur ? cur.l : (placeholder||"เลือก")}</span>
        <Chevron open={pp.open}/>
      </button>
      <select value={value} onChange={e => onChange(e.target.value)} style={{display:"none"}} aria-hidden="true" tabIndex={-1}>
        {placeholder && <option value="">{placeholder}</option>}
        {opts.map(o => <option key={String(o.v)} value={o.v}>{o.l}</option>)}
      </select>
      {pp.open && pp.pos && <div role="listbox" style={{...t.pickMenu, left:pp.pos.left, width:pp.pos.width, ...(pp.pos.up?{bottom:"calc(100% + 6px)"}:{top:"calc(100% + 6px)"})}}>
        {searchable && <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="พิมพ์เพื่อค้นหา" style={t.pickSearch}/>}
        <div style={{maxHeight:pp.pos.maxH, overflowY:"auto"}}>
          {shown.map(o => { const on = String(o.v) === String(value); return (
            <button key={String(o.v)} type="button" role="option" aria-selected={on} className="tap" onClick={() => pick(o.v)} style={on ? t.pickOptOn : t.pickOpt}>
              {o.ic && <Emo e={o.ic}/>}
              <span style={{flex:1, minWidth:0, fontFamily:isMono?t.monoFont:"inherit"}}>{o.l}</span>
              {on && <span style={t.roleOptCheck}>✓</span>}
            </button>); })}
          {!shown.length && <div style={{padding:"12px", color:t.dimColor, fontSize:13, textAlign:"center"}}>ไม่พบ</div>}
        </div>
      </div>}
    </span>
  );
}
// ช่องชื่อกล้อง: พิมพ์ได้อิสระ และมีรายการกล้องในพื้นที่นั้นให้แตะเลือก (กรองตามที่พิมพ์)

// เลือกชื่อคน: ตัวเลือกน้อยเป็นปุ่มแตะ + "อื่น ๆ" (พิมพ์เอง) · ถ้าเกิน 8 ชื่อเปลี่ยนเป็นเมนูมีช่องค้นหา

// มาสคอต "น้องกล้อง": กล้องวงจรปิดติดผนัง หน้ายิ้ม แก้มชมพู (วาดเอง ใช้ได้อิสระ)
